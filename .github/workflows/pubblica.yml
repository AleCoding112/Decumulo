# A ogni push su `main` gira `node verifica.mjs`: se un solo passo fallisce la
# pubblicazione si ferma e online resta la versione buona.
#
# `sito/` non sta nel repository, lo ricostruisce questo lavoro: così non può
# finire online una cartella costruita a mano che non è passata dai controlli.
#
# Resta fuori di proposito `verifiche/a-schermo.mjs`, che apre Chrome: si lancia
# a mano quando si tocca il layout, perché qui renderebbe la pubblicazione lenta
# e fragile per una cosa che va comunque guardata con gli occhi.
#
# Due momenti in cui fallirà, ed è voluto: passato il 1° gennaio `scadenze.mjs`
# blocca finché i parametri dell'anno nuovo non sono riverificati; e quando una
# modifica al testo rompe una frase, prima che arrivi al pubblico.
name: pubblica

on:
  push:
    branches: [main]
  # per ripubblicare senza modifiche, dal pannello Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# una pubblicazione alla volta, e non si annulla quella in corso: meglio
# arrivare in ritardo che lasciare online mezza cosa
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifica-e-pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # nessuna dipendenza da installare: il progetto è Node puro, senza
      # node_modules. È anche il motivo per cui questo lavoro dura pochi secondi.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: i controlli, tutti
        run: node verifica.mjs

      - uses: actions/configure-pages@v5

      # `sito/` esiste perché l'ha appena costruito verifica.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - id: deploy
        uses: actions/deploy-pages@v4
