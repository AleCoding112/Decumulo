# ============================================================================
#  LA PUBBLICAZIONE PASSA DAI CONTROLLI, O NON AVVIENE.
#
#  A ogni push su `main` GitHub esegue `node verifica.mjs` — build, 213 controlli
#  sul motore, le frasi su diciotto scenari, i valori ostili, le tavole dei
#  fondi, la seconda implementazione, 4.000 piani casuali, gli schermi, la
#  coerenza fra pagine e motore, la guardia sulle scadenze.
#  Se un solo passo fallisce, il lavoro si ferma qui e ONLINE RESTA LA VERSIONE
#  BUONA. È la stessa regola che il progetto si è dato per il codice, applicata
#  a quello che vede la gente.
#
#  `sito/` non sta nel repository: lo ricostruisce questo lavoro. Così non può
#  finire online una cartella costruita a mano che non è passata dai controlli.
#
#  RESTA FUORI DI PROPOSITO `verifiche/a-schermo.mjs`, che apre Chrome vero: si
#  lancia a mano quando si tocca il layout. Un controllo che qui richiederebbe
#  un browser renderebbe la pubblicazione lenta e fragile per una cosa che va
#  comunque guardata con gli occhi.
#
#  DUE MOMENTI IN CUI QUESTO FALLIRÀ, ed è voluto:
#   · passato il 1° gennaio, `scadenze.mjs` blocca finché i parametri dell'anno
#     nuovo non sono riverificati (l'assegno sociale si rivaluta a gennaio e la
#     legge di bilancio può cambiare gli scaglioni);
#   · se una modifica al testo rompe una frase, prima che arrivi al pubblico.
# ============================================================================
name: pubblica

on:
  push:
    branches: [main]
  # per ripubblicare senza modifiche, dal pannello Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# una pubblicazione alla volta, e non si annulla quella in corso: meglio
# arrivare in ritardo che lasciare online mezza cosa
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifica-e-pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # nessuna dipendenza da installare: il progetto è Node puro, senza
      # node_modules. È anche il motivo per cui questo lavoro dura pochi secondi.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: i controlli, tutti
        run: node verifica.mjs

      - uses: actions/configure-pages@v5

      # `sito/` esiste perché l'ha appena costruito verifica.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - id: deploy
        uses: actions/deploy-pages@v4
