<style>
  :root{--bg:#faf8f4;--card:#fff;--ink:#26241f;--soft:#5f5b52;--tenue:#8a857a;
    --line:#e4e0d7;--su:#2f6f4e;--giu:#a33a2a;--acc:#2f6f4e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .pagina{max-width:760px;margin:0 auto;padding:28px 20px 80px}
  .briciole{font-size:13px;color:var(--tenue);margin:0 0 22px}
  .briciole a{color:var(--soft)}
  h1{font-size:31px;line-height:1.2;letter-spacing:-.015em;margin:0 0 14px}
  h2{font-size:20px;line-height:1.3;margin:40px 0 12px}
  h3{font-size:16px;margin:26px 0 7px}
  p{margin:0 0 15px}
  .occhiello{font-size:18px;line-height:1.55;color:var(--soft);margin:0 0 30px}
  a{color:var(--acc)}
  ul{margin:0 0 15px;padding-left:20px}
  li{margin-bottom:7px}
  /* L'indice lo scrive il build dai titoli. Su due colonne perché su `il-metodo.html` le voci
     sono ventinove: in colonna sola sarebbero un muro davanti al muro che dovevano aprire.
     `scroll-margin-top` serve o il titolare finisce incollato al bordo dopo il salto. */
  .indice{margin:0 0 34px;padding:15px 20px 12px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.45}
  .indice ul{margin:0;padding:0;list-style:none}
  .indice>ul{columns:2;column-gap:30px}
  .indice li{margin:0 0 7px;break-inside:avoid}
  .indice ul ul{margin:5px 0 0 13px;font-size:13px;border-left:2px solid var(--line);
    padding-left:10px}
  .indice ul ul li{margin:0 0 4px}
  .indice a{color:var(--soft);text-decoration:none}
  .indice a:hover{color:var(--acc);text-decoration:underline}
  h2,h3{scroll-margin-top:14px}
  @media (max-width:600px){ .indice>ul{columns:1} }
  .chiave{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--su);
    border-radius:0 9px 9px 0;padding:16px 20px;margin:24px 0}
  .chiave p:last-child{margin:0}
  .allarme{border-left-color:var(--giu)}
  /* UNA TABELLA CHE NON CI STA DEVE SCORRERE DENTRO IL SUO RIQUADRO, non far scorrere di lato
     tutta la pagina: su un telefono è la differenza fra un dato consultabile e una pagina che
     scappa sotto il dito. Vale per tutti e due i contenitori di tabelle, non solo per uno. */
  .scorre,.conto{overflow-x:auto}
  .scorre{margin:20px 0}
  table{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tenue);
    font-weight:600;white-space:nowrap}
  td.ok{color:var(--su)} td.ko{color:var(--giu);font-weight:600}
  .conto{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;
    margin:22px 0;font-variant-numeric:tabular-nums}
  .conto table{font-size:15px}
  .conto td:last-child{text-align:right}
  .conto tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
  .fonti{font-size:13.5px;color:var(--soft);margin-top:42px;padding-top:18px;
    border-top:1px solid var(--line)}
  /* i tre livelli di fonte, sempre distinti: legge · contratto collettivo · stima nostra */
  .marca{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;padding:2px 7px;border-radius:4px;vertical-align:2px;margin-right:6px}
  .m-legge{background:#e8efe9;color:var(--su)}
  .m-ccnl{background:#eceaf3;color:#4b4468}
  .m-stima{background:#f6ece9;color:var(--giu)}
  .legenda-fonti{font-size:12.5px;color:var(--tenue);margin:0 0 26px;line-height:1.9}
  .pie{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
    font-size:12.5px;line-height:1.6;color:var(--tenue)}
  .pie p{margin:0 0 10px;max-width:78ch}
  .pie b{color:var(--soft)}
  .pie a{color:var(--soft)}
  .pie-nav{font-size:13px}
  .pie-nav a{color:var(--acc);white-space:nowrap}
  .torna{display:inline-block;margin-top:34px;padding:11px 18px;background:var(--su);color:#fff;
    text-decoration:none;border-radius:9px;font-size:15px;font-weight:600}
</style>
